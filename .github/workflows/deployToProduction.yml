name: Deploy To Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to deploy from (default: master)'
        required: false
        default: 'master'
        type: string

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      full_sha: ${{ steps.meta.outputs.full_sha }}
      source: ${{ steps.meta.outputs.source }}
      size: ${{ steps.meta.outputs.size }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch || 'master' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install & build
        run: |
          cat > .env <<'EOF'
          APP_NAME=Laravel
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=http://localhost
          EOF
          echo "::group::npm ci"
          npm ci
          echo "::endgroup::"
          echo "::group::vite production build"
          NODE_ENV=production npm run build
          echo "::endgroup::"
          rm -f .env

      - name: Record meta
        id: meta
        run: |
          SOURCE="${{ github.event.inputs.source_branch || 'master' }}"
          SHA="$(git rev-parse --short=12 HEAD)"
          FULL="$(git rev-parse HEAD)"
          SIZE="$(du -sh public/build | awk '{print $1}')"
          test -d public/build && test -n "$(ls -A public/build)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "full_sha=$FULL" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          {
            echo "## Build"
            echo "| | |"
            echo "|---|---|"
            echo "| Source | \`$SOURCE\` |"
            echo "| Commit | [\`$SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/$FULL) |"
            echo "| Assets | \`$SIZE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push deploy branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -B deploy
          git add -f public/build
          [ -f public/mix-manifest.json ] && git add -f public/mix-manifest.json || true
          [ -f public/hot ] && git rm -f public/hot || true
          git commit -m "Build assets from ${{ steps.meta.outputs.source }} @ ${{ steps.meta.outputs.sha }}" --allow-empty
          git push -f origin deploy

  deploy:
    name: Production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/public_html
            git fetch origin deploy --prune
            git checkout origin/deploy -- deploy.sh
            chmod +x deploy.sh
            ./deploy.sh

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ needs.build.outputs.sha }}"
          FULL="${{ needs.build.outputs.full_sha }}"
          SOURCE="${{ needs.build.outputs.source }}"
          SIZE="${{ needs.build.outputs.size }}"
          ICON='✅'
          [ "$STATUS" = "success" ] || ICON='❌'
          {
            echo "## $ICON Production"
            echo "| | |"
            echo "|---|---|"
            echo "| Result | \`$STATUS\` |"
            echo "| Source | \`$SOURCE\` |"
            echo "| Commit | [\`$SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/$FULL) |"
            echo "| Assets | \`$SIZE\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Production $STATUS::$SOURCE @ $SHA"
